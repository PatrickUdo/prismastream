# PrismaStream stack for vps.prisma-scripts.com (/opt/stacks/prismastream, managed by Dockge).
# Nginx Proxy Manager (network "proxy") terminates TLS:
#   prismastream.patrickudo.nl          -> prismastream-web:80
#   backend.prismastream.patrickudo.nl  -> prismastream-backend:8787
# Secrets live in ./.env on the server (never in git): SERVER_KEY, SIGNUP_CODE, TMDB_API_KEY.
# Images are built on a workstation (deploy/deploy.sh) and loaded here: the VPS has no swap
# and too little free RAM to run npm ci / vite build safely next to the other services.
name: prismastream

services:
  backend:
    container_name: prismastream-backend
    image: prismastream-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
      DATA_DIR: /data
      PUBLIC_URL: https://backend.prismastream.patrickudo.nl
      CORS_ORIGINS: https://prismastream.patrickudo.nl
      TRUST_PROXY: "true"
      ALLOW_SIGNUP: "false"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data:/data
    mem_limit: 768m
    networks: [proxy]

  web:
    container_name: prismastream-web
    image: prismastream-web:latest
    restart: unless-stopped
    mem_limit: 64m
    networks: [proxy]

networks:
  proxy:
    external: true
